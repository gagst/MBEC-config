[project]
name = "mbec-configurator"
version = "1.0.0"
description = "Knowledge-Enhanced Configuration of Energy Scheduling Models in Multi-Building Energy Communities"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Stepan Gagin" },
]
requires-python = "~=3.13.0"
dependencies = [
    "inflect~=7.5.0",
    "jinja2~=3.1.6",
    "linkml~=1.9.6",
    "matplotlib~=3.10.8",
    "networkx~=3.6.1",
    "ollama~=0.6.1",
    "pandas~=2.3.3",
    "pydantic~=2.12.4",
    "pyyaml~=6.0.2",
    "seaborn~=0.13.2",
    "rapidfuzz~=3.14.5",
    "tqdm~=4.67.3",
    "rdflib>=7.5.0",
]

[dependency-groups]
dev = [
    "jupyter~=1.1.1",
    "ruff~=0.15.8",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
generate-scenarios = "generate_scenarios:main"
apply-rules = "apply_rules:main"
apply-llm = "apply_llm:main"
evaluate-results = "evaluate_results:main"

[tool.ruff]
line-length = 120
